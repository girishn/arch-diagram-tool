name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the scripts import .ts files directly; Node 24 strips the types without a flag
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check-themes
      - run: npm test
      - run: node scripts/lint.ts --format github examples # annotates warnings on the run; fails on any error
      - run: npm run check:package # builds dist, smoke-tests it in plain Node, then publint and are-the-types-wrong
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
